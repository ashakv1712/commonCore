<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Strive Math · Grade 7 Curriculum</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root {
  --coral:#E8420A;
  --teal:#00C896;
  --amber:#F5A623;
  --blue:#4A8FFF;
  --purple:#C44DFF;
  --green:#22C55E;

  --bg:#07090F;
  --surface:#141820;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.12);

  --text1:#F0F4FF;
  --text2:#8FA4C8;
  --text3:#4A6080;

  --display:'Syne',sans-serif;
  --font:'DM Sans',sans-serif;
}

body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--text1);
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px 40px;
}
.hero h1{
  font-family:var(--display);
  font-size:64px;
}
.hero p{
  color:var(--text2);
}

/* TOOLBAR */
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.domain-pills{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.dp{
  font-size:11px;
  padding:5px 12px;
  border-radius:100px;
  border:1px solid var(--border2);
  color:var(--text3);
  cursor:pointer;
}
.dp.on{
  background:white;
  color:black;
}

/* ROADMAP */
.roadmap{
  max-width:900px;
  margin:40px auto;
  position:relative;
  padding-left:60px;
}

.rm-spine{
  position:absolute;
  left:20px;
  top:0;
  bottom:0;
  width:2px;
  background:linear-gradient(var(--coral),var(--teal),var(--blue),var(--purple));
  opacity:0.3;
}

.rm-item{
  position:relative;
  margin-bottom:16px;
}

.rm-node{
  position:absolute;
  left:-52px;
  top:18px;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  border:2px solid;
  background:var(--bg);
}

/* CARD */
.rm-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.rm-card-hdr{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.rm-card-name{
  font-family:var(--display);
  font-weight:700;
}

.rm-card-desc{
  font-size:12px;
  color:var(--text3);
}

.rm-pills-row{
  display:none;
  padding:10px 20px;
  flex-wrap:wrap;
  gap:6px;
}

.rm-pill{
  font-size:11px;
  padding:4px 10px;
  border-radius:100px;
  border:1px solid;
  cursor:pointer;
}

.rm-pill.sel{
  color:white;
}

.rm-detail{
  max-height:0;
  overflow:hidden;
  transition:0.3s;
}

.rm-det-in{
  padding:14px 20px;
  border-top:1px solid var(--border);
}

.rm-sk{
  font-size:11px;
  background:#111;
  padding:4px 8px;
  border-radius:6px;
  margin:2px;
  display:inline-block;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Grade 7</h1>
  <p>Learning Roadmap · Common Core</p>
</div>

<div class="toolbar">
  <div>Explore learning progression</div>
  <div class="domain-pills" id="dpRow"></div>
</div>

<div class="roadmap" id="rmWrap">
  <div class="rm-spine"></div>
</div>

<script>

/* DATA */
const DS = [
{
id:'RP',name:'Ratios & Proportions',c:'#E8420A',
outcomes:[
{t:'Unit rates',skills:['Find unit rate','Compare rates']},
{t:'Percent problems',skills:['Discount','Tax','Interest']}
]
},
{
id:'NS',name:'Number System',c:'#00C896',
outcomes:[
{t:'Add/subtract integers',skills:['Rules','Number line']},
{t:'Multiply/divide',skills:['Sign rules']}
]
},
{
id:'EE',name:'Expressions & Equations',c:'#F5A623',
outcomes:[
{t:'Solve equations',skills:['Two-step','Word problems']}
]
}
];

/* FILTERS */
function buildFilters(){
  const row=document.getElementById('dpRow');

  const all=document.createElement('div');
  all.className='dp on';
  all.innerText='All';
  all.onclick=()=>setFilter('all');
  row.appendChild(all);

  DS.forEach(d=>{
    const b=document.createElement('div');
    b.className='dp';
    b.innerText=d.id;
    b.onclick=()=>setFilter(d.id);
    row.appendChild(b);
  });
}

function setFilter(id){
  document.querySelectorAll('.dp').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');

  document.querySelectorAll('.rm-item').forEach(el=>{
    el.style.display=(id==='all'||el.dataset.domain===id)?'':'none';
  });
}

/* ROADMAP */
function buildRoadmap(){
  const wrap=document.getElementById('rmWrap');

  DS.forEach((d,di)=>{
    const item=document.createElement('div');
    item.className='rm-item';
    item.dataset.domain=d.id;

    item.innerHTML=`
      <div class="rm-node" style="border-color:${d.c};color:${d.c}">${d.id}</div>
      <div class="rm-card">
        <div class="rm-card-hdr" onclick="toggleRm(this)">
          <div>
            <div class="rm-card-name">${d.name}</div>
            <div class="rm-card-desc">${d.outcomes.length} outcomes</div>
          </div>
        </div>
        <div class="rm-pills-row">
          ${d.outcomes.map((o,i)=>`
            <div class="rm-pill" style="border-color:${d.c};color:${d.c}" onclick="showDetail(event, this, '${d.c}', '${o.t}', '${o.skills.join('|')}')">
              ${i+1}. ${o.t}
            </div>
          `).join('')}
        </div>
        <div class="rm-detail"></div>
      </div>
    `;

    wrap.appendChild(item);
  });
}

function toggleRm(el){
  const card=el.parentElement;
  const pills=card.querySelector('.rm-pills-row');
  pills.style.display = pills.style.display==='flex' ? 'none' : 'flex';
}

function showDetail(e, el, color, title, skills){
  e.stopPropagation();

  const pills = el.parentElement.querySelectorAll('.rm-pill');
  pills.forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel');
  el.style.background=color;

  const detail = el.closest('.rm-card').querySelector('.rm-detail');

  detail.innerHTML=`
    <div class="rm-det-in">
      <strong>${title}</strong>
      <div style="margin-top:8px;">
        ${skills.split('|').map(s=>`<span class="rm-sk">${s}</span>`).join('')}
      </div>
    </div>
  `;

  detail.style.maxHeight='200px';
}

/* INIT */
buildFilters();
buildRoadmap();

</script>

</body>
</html>
